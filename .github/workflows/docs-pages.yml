name: Deploy documentation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'docs/**'
      - 'study/**'
      - 'study-examples/**'
      - 'START-HERE.md'
      - 'SITE-HOME.md'
      - 'README.md'
      - 'README.zh.md'
      - 'README.i18n.yaml'
      - 'study-tools/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/project-doc-site.ts'
      - 'scripts/project-doc-site.spec.ts'
      - 'website/**'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  NODE_OPTIONS: '--max-old-space-size=4096'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The study gates read file trees out of the pinned upstream commit in
      # study/source-index-manifest.json. That commit belongs to the upstream
      # repository rather than this fork's branch history, so neither the
      # default shallow checkout nor fetch-depth: 0 brings it in. Fetch it by
      # SHA, which the fork network serves, and fail here rather than inside a
      # gate if the object is unreachable.
      - name: Fetch the pinned upstream commit the study gates read
        run: |
          commit="$(node -p "require('./study/source-index-manifest.json').commit")"
          git fetch --no-tags --depth 1 origin "$commit"
          git cat-file -e "$commit^{tree}"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Verify offline study bridge
        run: pnpm run study-bridge:test

      - name: Verify deterministic study lab
        run: pnpm run study-lab:test

      - name: Verify and build documentation
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run doc-sync

      - name: Verify the published study shell before upload
        # pnpm 11 forwards `--` to the script, and quick-check.mjs rejects it as
        # an unknown option, so the separator has to go.
        run: pnpm run study:quick-check --site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/.dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
